name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Alisa-trigger
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffb8d9&color_dots=#161616,#2e2e2e,#5a5a5a,#9a9a9a,#e8e8e8        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
